<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yaniv</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">
  <div class="home-container">
    <header>
      <h1 class="logo">Yaniv</h1>
      <p class="tagline">The fast-paced card game</p>
    </header>

    <section class="howto-link-box">
      <a href="/how-to.html" class="btn btn-secondary howto-link-btn">How to Play</a>
    </section>

    <div class="panels">
      <div class="panel">
        <h2>Create Game</h2>
        <div class="form-group">
          <label for="create-name">Your name</label>
          <input id="create-name" type="text" maxlength="20" placeholder="Enter your name" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="ai-count-options">AI opponents</label>
          <div id="ai-count-options" class="ai-count-toggle" role="group" aria-label="AI opponents">
            <button type="button" class="ai-count-option active" data-value="0" aria-pressed="true">None</button>
            <button type="button" class="ai-count-option" data-value="1" aria-pressed="false">1</button>
            <button type="button" class="ai-count-option" data-value="2" aria-pressed="false">2</button>
            <button type="button" class="ai-count-option" data-value="3" aria-pressed="false">3</button>
          </div>
          <div class="ai-hint">Total players capped at 4</div>
        </div>
        <div id="ai-difficulty-group" class="form-group hidden">
          <label for="ai-difficulty-toggle">AI level</label>
          <div class="ai-difficulty-row">
            <span class="ai-difficulty-emoji" aria-hidden="true">🧠</span>
            <label class="ai-switch" for="ai-difficulty-toggle">
              <input id="ai-difficulty-toggle" type="checkbox" checked>
              <span class="ai-switch-track" aria-hidden="true"></span>
              <span class="sr-only">Toggle AI level between Easy and Hard</span>
            </label>
            <span class="ai-difficulty-emoji" aria-hidden="true">🧠🧠🧠</span>
          </div>
        </div>
        <button id="create-btn" class="btn btn-primary">Create Game</button>
        <p id="create-error" class="error-msg"></p>
      </div>

      <div class="panel">
        <h2>Join Game</h2>
        <div class="form-group">
          <label for="join-name">Your name</label>
          <input id="join-name" type="text" maxlength="20" placeholder="Enter your name" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="join-code">Room code</label>
          <input id="join-code" type="text" maxlength="5" placeholder="abcde" autocomplete="off" class="code-input">
        </div>
        <button id="join-btn" class="btn btn-secondary">Join Game</button>
        <p id="join-error" class="error-msg"></p>
      </div>
    </div>
  </div>

  <script src="/js/shared/pid.js"></script>
  <script>
    const pid = getYanivPid();

    // Pre-fill name from last used (per PID); user can still change it
    const lastName = localStorage.getItem('yanivName');
    if (lastName) {
      document.getElementById('create-name').value = lastName;
      document.getElementById('join-name').value = lastName;
    }

    const aiCountOptionEls = Array.from(document.querySelectorAll('.ai-count-option'));
    const aiDifficultyGroupEl = document.getElementById('ai-difficulty-group');
    const aiDifficultyToggleEl = document.getElementById('ai-difficulty-toggle');
    let selectedAiCount = 0;

    function setAiCount(value) {
      selectedAiCount = value;
      aiDifficultyGroupEl.classList.toggle('hidden', value === 0);
      aiCountOptionEls.forEach((optionEl) => {
        const isActive = parseInt(optionEl.dataset.value, 10) === value;
        optionEl.classList.toggle('active', isActive);
        optionEl.setAttribute('aria-pressed', String(isActive));
      });
    }

    aiCountOptionEls.forEach((optionEl) => {
      optionEl.addEventListener('click', () => {
        setAiCount(parseInt(optionEl.dataset.value, 10));
      });
    });

    setAiCount(selectedAiCount);

    document.getElementById('create-btn').addEventListener('click', async () => {
      const name = document.getElementById('create-name').value.trim();
      const aiDifficulty = aiDifficultyToggleEl.checked ? 'hard' : 'easy';
      if (!name) { document.getElementById('create-error').textContent = 'Enter your name'; return; }
      const res = await fetch('/api/create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, aiCount: selectedAiCount, aiDifficulty, pid})
      });
      const data = await res.json();
      if (data.error) { document.getElementById('create-error').textContent = data.error; return; }
      if (data.pid) localStorage.setItem('yanivPid', data.pid); // sync with server
      localStorage.setItem('yanivName', name);
      window.location.href = `/game/${data.code}`;
    });

    document.getElementById('join-btn').addEventListener('click', async () => {
      const name = document.getElementById('join-name').value.trim();
      const code = document.getElementById('join-code').value.trim().toLowerCase();
      if (!name) { document.getElementById('join-error').textContent = 'Enter your name'; return; }
      if (!code) { document.getElementById('join-error').textContent = 'Enter room code'; return; }
      const res = await fetch('/api/join', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, code, pid})
      });
      const data = await res.json();
      if (data.error) { document.getElementById('join-error').textContent = data.error; return; }
      if (data.pid) localStorage.setItem('yanivPid', data.pid); // sync with server
      localStorage.setItem('yanivName', name);
      window.location.href = `/game/${code}`;
    });

    // allow enter key in join code field
    document.getElementById('join-code').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('join-btn').click();
    });
    document.getElementById('create-name').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('create-btn').click();
    });
    document.getElementById('join-name').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('join-btn').click();
    });
  </script>
</body>
</html>
