<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1020">
<meta name="format-detection" content="telephone=no">
<title>Zanagrams</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="zan.css">
</head>
<body>
<div id="app">

  <header class="hud">
    <div class="hud-row">
      <div class="timer" id="timer">
        <span class="timer-value" id="timerValue">0:00</span>
        <div class="timer-toasts" id="timerToasts"></div>
      </div>
      <div class="counter" id="counter">
        <span class="counter-nums"><b id="solvedCount">0</b> / <span id="totalCount">0</span></span>
        <span class="counter-label">words</span>
      </div>
      <button class="btn-new" id="newGame" type="button">New</button>
    </div>

    <div class="longest" id="longest">
      <span class="longest-star">★</span>
      <span class="longest-text" id="longestText">—</span>
    </div>

    <div class="current" id="current" aria-live="polite"><span class="current-text" id="currentText"></span></div>
  </header>

  <main class="board-wrap">
    <svg id="board" class="board" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" aria-label="Letter board"></svg>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet">
      <div class="sheet-emoji" id="sheetEmoji">🎉</div>
      <h1 class="sheet-title" id="sheetTitle">Solved!</h1>
      <div class="sheet-time" id="sheetTime">0:00</div>
      <p class="sheet-sub" id="sheetSub"></p>
      <ul class="sheet-words" id="sheetWords"></ul>
      <button class="btn-primary" id="playAgain" type="button">Play again</button>
    </div>
  </div>

</div>

<script src="data/common.js"></script>
<script src="data/dict.js"></script>
<script src="js/generator.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
