<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1020">
<meta name="format-detection" content="telephone=no">
<title>Zanagrams</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="zan.css">
</head>
<body>
<div id="app">

  <header class="hud">
    <div class="hud-row">
      <div class="timer" id="timer">
        <span class="timer-value" id="timerValue">0:00</span>
        <div class="timer-toasts" id="timerToasts"></div>
      </div>
      <div class="hud-stats">
        <div class="stat">
          <span class="stat-value" id="bonusCount">0</span>
          <span class="stat-label">bonus</span>
        </div>
        <button class="btn-new" id="newGame" type="button">New</button>
      </div>
    </div>
    <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
    <div class="current" id="current" aria-live="polite"><span class="current-text" id="currentText"></span></div>
  </header>

  <main class="board-wrap">
    <svg id="board" class="board" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" aria-label="Letter board"></svg>
  </main>

  <footer class="targets" id="targets"></footer>

  <div class="overlay" id="overlay" hidden>
    <div class="sheet">
      <div class="sheet-emoji" id="sheetEmoji">🎉</div>
      <h1 class="sheet-title" id="sheetTitle">Solved!</h1>
      <p class="sheet-sub" id="sheetSub"></p>
      <ul class="sheet-words" id="sheetWords"></ul>
      <button class="btn-primary" id="playAgain" type="button">Play again</button>
    </div>
  </div>

</div>

<script src="data/common.js"></script>
<script src="data/dict.js"></script>
<script src="js/generator.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
